name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: smartresolve.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Build Tailwind assets
        run: npm ci && npm run build:css

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

      - name: Check production security settings
        env:
          DJANGO_SETTINGS_MODULE: smartresolve.settings.production
          DJANGO_SECRET_KEY: ci-production-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          DJANGO_ALLOWED_HOSTS: example.up.railway.app
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.up.railway.app
          DATABASE_URL: postgresql://user:password@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check --deploy
